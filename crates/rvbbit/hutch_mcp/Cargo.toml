[package]
name = "hutch_mcp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hutch-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
mcp_core = { path = "../mcp_core" }
rmcp = { version = "3.6", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
rvbbit_contract = { path = "../rvbbit_contract" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "sync", "time", "net"] }
futures = "0.3"
http = "1"
chrono = "0.4"

[dev-dependencies]
ureq = "2.12"
