[package]
name = "hutch_mcp"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hutch-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.8"
mcp_core = { path = "../mcp_core" }
pg_sha2 = { path = "../../common/sha2" }
ring = "0.17"
ureq = "2.12"
rmcp = { version = "3.6", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    # Enables reqwest's rustls stack (aws-lc-rs + the platform verifier).
    # `transport-streamable-http-client-reqwest` only turns the client on;
    # without this feature every https:// MCP server fails in initialize.
    "reqwest",
] }
rvbbit_contract = { path = "../rvbbit_contract" }
schemars = "1"
socket2 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "sync", "time", "net"] }
futures = "0.3"
http = "1"
chrono = "0.4"

[dev-dependencies]
ureq = "2.12"
hutch_mock = { path = "../hutch_mock" }
